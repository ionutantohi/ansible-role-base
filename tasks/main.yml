- name: update apt cache
  apt: update_cache=yes
  become: true

- name: Install system packages
  apt:
    pkg: "{{apt_default_packages + apt_extra_packages}}"
    state: latest
  become: true

- name: ensure services are started and set to start on boot
  service:
    name: "{{item}}"
    state: started
    enabled: yes
  with_items:
    - redis-server
    - supervisor
    - chrony
  become: yes

- name: configure localtime
  file:
    src: /usr/share/zoneinfo/{{ application_timezone }}
    dest: /etc/localtime
    owner: root
    group: root
    mode: 644
    state: link
    force: yes
  register: server_timezone
  become: true

- name: update timezone
  command: dpkg-reconfigure --frontend noninteractive tzdata
  when: server_timezone.changed
  become: true
  notify:
    - restart cron

- name: setup ssh forwarding for 'become'
  copy:
    content: |
      Defaults        env_keep+=SSH_AUTH_SOCK
    dest: /etc/sudoers.d/10-keep-ssh-env
    mode: 0440
  become: yes

- name: add ssh keys to authorized keys
  authorized_key:
    user: "{{ansible_user}}"
    key: "{{item.type | default('ssh-rsa')}} {{item.hash}} {{item.comment}}"
    state: present
  with_items: "{{ssh_keys}}"
