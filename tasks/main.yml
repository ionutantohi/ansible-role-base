- name: wait for cloud-init to finish
  command: cloud-init status --wait
  changed_when: false
  become: yes

- name: remove stale known_hosts entry for this box
  local_action:
    module: known_hosts
    name: "{{ inventory_hostname }}"
    state: absent

- name: mask tmp.mount so /tmp stays on disk instead of tmpfs
  systemd:
    name: tmp.mount
    masked: yes
  become: yes
  register: tmp_mount_masked

- name: unmount /tmp if it is currently on tmpfs
  command: umount -l /tmp
  become: yes
  failed_when: false
  when: tmp_mount_masked.changed

- name: force a fresh SSH connection so agent forwarding re-negotiates against the new /tmp
  meta: reset_connection

- name: update apt cache
  apt: update_cache=yes
  become: yes

- name: install system packages
  apt:
    pkg: "{{apt_default_packages + apt_extra_packages}}"
    state: latest
  become: yes

- name: ensure services are started and set to start on boot
  service:
    name: "{{item}}"
    state: started
    enabled: yes
  with_items:
    - redis-server
    - supervisor
    - chrony
  become: yes

- name: configure localtime
  file:
    src: /usr/share/zoneinfo/{{ application_timezone }}
    dest: /etc/localtime
    owner: root
    group: root
    mode: 644
    state: link
    force: yes
  register: server_timezone
  become: yes

- name: update timezone
  command: dpkg-reconfigure --frontend noninteractive tzdata
  when: server_timezone.changed
  become: yes
  notify:
    - restart cron

- name: create a group for ssh users
  group:
    name: developers
    state: present
  become: yes

 # the password must be in crypt format. use "openssl passwd -6" to generate it
- name: create ssh users
  user:
    name: "{{item.username}}"
    password: "{{item.password}}"
    groups: developers,sudo
    shell: /bin/bash
    append: yes
  loop: "{{ssh_users}}"
  become: yes

- name: add ssh keys to users
  authorized_key:
    user: "{{item.0.username}}"
    key: "{{item.1.type | default('ssh-rsa')}} {{item.1.hash}} {{item.1.comment}}"
    state: present
  loop: "{{ssh_users|subelements('keys')}}"
  become: yes

- name: setup ssh forwarding for 'become'
  copy:
    content: |
      Defaults        env_keep+=SSH_AUTH_SOCK
    dest: /etc/sudoers.d/10-keep-ssh-env
    mode: 0440
  become: yes
